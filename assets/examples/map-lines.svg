<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 434" width="400" height="434" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Map line styles</title>
  <desc id="d">Eleven line samples: national, regional and disputed borders, borders on data fills, coastline, river, road, confirmed and suspected routes, leader line and area outline.</desc>
  <rect width="400" height="434" fill="#ffffff"/>
  <rect x="16" y="16" width="150" height="28" rx="3" fill="#F8F5EF"/><line x1="28" y1="30" x2="154" y2="30" stroke="#C9C0AE" stroke-width="0.9"/><text x="186" y="35" font-size="14" fill="#191919">National border</text>
  <rect x="16" y="54" width="150" height="28" rx="3" fill="#F8F5EF"/><line x1="28" y1="68" x2="154" y2="68" stroke="#DCD5C6" stroke-width="0.8" stroke-dasharray="3 2"/><text x="186" y="73" font-size="14" fill="#191919">Regional border</text>
  <rect x="16" y="92" width="150" height="28" rx="3" fill="#F8F5EF"/><line x1="28" y1="106" x2="154" y2="106" stroke="#C9C0AE" stroke-width="1.2" stroke-dasharray="0.1 2.4" stroke-linecap="round"/><text x="186" y="111" font-size="14" fill="#191919">Disputed border</text>
  <rect x="16" y="130" width="150" height="28" rx="3" fill="#338877"/><line x1="28" y1="144" x2="154" y2="144" stroke="#FFFFFF" stroke-width="0.8"/><text x="186" y="149" font-size="14" fill="#191919">Border on data fills</text>
  <rect x="16" y="168" width="150" height="28" rx="3" fill="#DCE7EA"/><line x1="28" y1="182" x2="154" y2="182" stroke="#FFFFFF" stroke-width="0.8"/><text x="186" y="187" font-size="14" fill="#191919">Coastline</text>
  <rect x="16" y="206" width="150" height="28" rx="3" fill="#F8F5EF"/><line x1="28" y1="220" x2="154" y2="220" stroke="#BBD0D6" stroke-width="1.2"/><text x="186" y="225" font-size="14" fill="#191919">River</text>
  <rect x="16" y="244" width="150" height="28" rx="3" fill="#F8F5EF"/><line x1="28" y1="258" x2="154" y2="258" stroke="#FFFFFF" stroke-width="1.5"/><text x="186" y="263" font-size="14" fill="#191919">Road</text>
  <rect x="16" y="282" width="150" height="28" rx="3" fill="#F8F5EF"/><line x1="28" y1="296" x2="154" y2="296" stroke="#2B5B9B" stroke-width="2" stroke-linecap="round"/><text x="186" y="301" font-size="14" fill="#191919">Route, confirmed</text>
  <rect x="16" y="320" width="150" height="28" rx="3" fill="#F8F5EF"/><line x1="28" y1="334" x2="154" y2="334" stroke="#2B5B9B" stroke-width="2" stroke-dasharray="5 3"/><text x="186" y="339" font-size="14" fill="#191919">Route, suspected</text>
  <rect x="16" y="358" width="150" height="28" rx="3" fill="#F8F5EF"/><line x1="28" y1="372" x2="154" y2="372" stroke="#2E3A3D" stroke-width="0.75"/><text x="186" y="377" font-size="14" fill="#191919">Leader line</text>
  <rect x="16" y="396" width="150" height="28" rx="3" fill="#F8F5EF"/><line x1="28" y1="410" x2="154" y2="410" stroke="#1F5247" stroke-width="1.5"/><text x="186" y="415" font-size="14" fill="#191919">Area outline</text>
</svg>
