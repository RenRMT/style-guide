<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" width="660" height="404" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stacked area chart</title>
  <desc id="d">Three stacked areas from 2016 to 2025: Food at the bottom, then Shelter, then Cash. The total grows from 35 to 72 million euros, mostly because Cash grows from 5 to 30 million.</desc>
  <rect width="660" height="404" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">Aid has doubled, mostly through cash</text>
  <text x="48" y="64" font-size="15" fill="#191919">Aid delivered by type (million euros), 2016–2025</text>

  <!-- gridlines and axis values (areas always start at zero) -->
  <g stroke="#ECECEC" stroke-width="1">
    <line x1="80" y1="278" x2="610" y2="278"/>
    <line x1="80" y1="226" x2="610" y2="226"/>
    <line x1="80" y1="174" x2="610" y2="174"/>
    <line x1="80" y1="122" x2="610" y2="122"/>
  </g>
  <line x1="80" y1="330" x2="610" y2="330" stroke="#B8B8B8" stroke-width="1"/>
  <g font-size="13" fill="#191919" text-anchor="end">
    <text x="70" y="334">0</text>
    <text x="70" y="282">20</text>
    <text x="70" y="230">40</text>
    <text x="70" y="178">60</text>
    <text x="70" y="126">80</text>
  </g>

  <!-- stacked areas: the most stable series at the bottom -->
  <polygon points="80,278 138.9,275.4 197.8,272.8 256.7,272.8 315.6,270.2 374.4,270.2 433.3,267.6 492.2,267.6 551.1,265 610,265 610,330 551.1,330 492.2,330 433.3,330 374.4,330 315.6,330 256.7,330 197.8,330 138.9,330 80,330" fill="#338877"/>
  <polygon points="80,252 138.9,246.8 197.8,241.6 256.7,239 315.6,236.4 374.4,233.8 433.3,228.6 492.2,228.6 551.1,223.4 610,220.8 610,265 551.1,265 492.2,267.6 433.3,267.6 374.4,270.2 315.6,270.2 256.7,272.8 197.8,272.8 138.9,275.4 80,278" fill="#FFDD77"/>
  <polygon points="80,239 138.9,231.2 197.8,220.8 256.7,213 315.6,202.6 374.4,192.2 433.3,176.6 492.2,166.2 551.1,153.2 610,142.8 610,220.8 551.1,223.4 492.2,228.6 433.3,228.6 374.4,233.8 315.6,236.4 256.7,239 197.8,241.6 138.9,246.8 80,252" fill="#2B5B9B"/>

  <!-- direct labels inside the areas -->
  <text x="492.2" y="303.3" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Food</text>
  <text x="492.2" y="252.6" font-size="13" font-weight="600" fill="#191919" text-anchor="middle">Shelter</text>
  <text x="492.2" y="201.9" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Cash</text>

  <!-- total at the end -->
  <text x="610" y="134.8" font-size="13" font-weight="600" fill="#191919" text-anchor="end">Total 72</text>

  <!-- x-axis values -->
  <g font-size="13" fill="#191919" text-anchor="middle">
    <text x="80" y="350">2016</text>
    <text x="256.7" y="350">2019</text>
    <text x="433.3" y="350">2022</text>
    <text x="610" y="350">2025</text>
  </g>

  <!-- source and note -->
  <text x="48" y="380" font-size="11" fill="#191919">Source: Example aid tracking, 2016–2025</text>
</svg>
