<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" width="660" height="404" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Truncated and zero-based bar axes</title>
  <desc id="d">The same two values, 51% and 54%, drawn twice. On the left the axis starts at 50, so Region B's bar looks four times as tall as Region A's. On the right the axis starts at zero, and the bars look almost the same, as they should.</desc>
  <rect width="660" height="404" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">A truncated axis turns a small gap into a big one</text>
  <text x="48" y="64" font-size="15" fill="#191919">Support for the proposal (%), the same data drawn two ways</text>

  <!-- panel: Avoid: the axis starts at 50 -->
  <text x="48" y="100" font-size="15" font-weight="700" fill="#191919">Avoid: the axis starts at 50</text>

  <g stroke="#ECECEC" stroke-width="1">
    <line x1="80" y1="290" x2="300" y2="290"/>
    <line x1="80" y1="250" x2="300" y2="250"/>
    <line x1="80" y1="210" x2="300" y2="210"/>
    <line x1="80" y1="170" x2="300" y2="170"/>
    <line x1="80" y1="130" x2="300" y2="130"/>
  </g>
  <line x1="80" y1="330" x2="300" y2="330" stroke="#B8B8B8" stroke-width="1"/>
  <g font-size="13" fill="#191919" text-anchor="end">
    <text x="70" y="334">50</text>
    <text x="70" y="294">51</text>
    <text x="70" y="254">52</text>
    <text x="70" y="214">53</text>
    <text x="70" y="174">54</text>
    <text x="70" y="134">55</text>
  </g>
  <rect x="98.2" y="290" width="73.7" height="40" fill="#338877"/>
  <text x="135" y="282" font-size="13" font-weight="600" fill="#191919" text-anchor="middle">51%</text>
  <text x="135" y="350" font-size="13" fill="#191919" text-anchor="middle">Region A</text>
  <rect x="208.2" y="170" width="73.7" height="160" fill="#338877"/>
  <text x="245" y="162" font-size="13" font-weight="600" fill="#191919" text-anchor="middle">54%</text>
  <text x="245" y="350" font-size="13" fill="#191919" text-anchor="middle">Region B</text>

  <!-- panel: Do: the axis starts at zero -->
  <text x="358" y="100" font-size="15" font-weight="700" fill="#191919">Do: the axis starts at zero</text>

  <g stroke="#ECECEC" stroke-width="1">
    <line x1="390" y1="263.3" x2="610" y2="263.3"/>
    <line x1="390" y1="196.7" x2="610" y2="196.7"/>
    <line x1="390" y1="130" x2="610" y2="130"/>
  </g>
  <line x1="390" y1="330" x2="610" y2="330" stroke="#B8B8B8" stroke-width="1"/>
  <g font-size="13" fill="#191919" text-anchor="end">
    <text x="380" y="334">0</text>
    <text x="380" y="267.3">20</text>
    <text x="380" y="200.7">40</text>
    <text x="380" y="134">60</text>
  </g>
  <rect x="408.1" y="160" width="73.7" height="170" fill="#338877"/>
  <text x="445" y="152" font-size="13" font-weight="600" fill="#191919" text-anchor="middle">51%</text>
  <text x="445" y="350" font-size="13" fill="#191919" text-anchor="middle">Region A</text>
  <rect x="518.1" y="150" width="73.7" height="180" fill="#338877"/>
  <text x="555" y="142" font-size="13" font-weight="600" fill="#191919" text-anchor="middle">54%</text>
  <text x="555" y="350" font-size="13" fill="#191919" text-anchor="middle">Region B</text>


  <!-- source and note -->
  <text x="48" y="380" font-size="11" fill="#191919">Source: Example opinion poll, 2025</text>
</svg>
