<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 476" width="660" height="476" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Clustered bar chart</title>
  <desc id="d">Five regions, each with three horizontal bars for children, adults and older people. Children are the most affected group in North, East and West; adults in Centre and South. North has the highest share for children at 42%.</desc>
  <rect width="660" height="476" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">Children are most affected in the north and east</text>
  <text x="48" y="64" font-size="15" fill="#191919">People with acute malnutrition (%), by region and age group, 2025</text>

  <!-- legend: above the plot, left-aligned, in bar order -->
  <rect x="48" y="86" width="12" height="12" fill="#338877"/><text x="66" y="97" font-size="13" fill="#191919">Children</text>
  <rect x="147.6" y="86" width="12" height="12" fill="#FFDD77"/><text x="165.6" y="97" font-size="13" fill="#191919">Adults</text>
  <rect x="232.8" y="86" width="12" height="12" fill="#2B5B9B"/><text x="250.8" y="97" font-size="13" fill="#191919">Older people</text>

  <!-- clusters: same series order in every cluster, 10.5 px per percentage point, 2 px between bars -->
  <text x="48" y="145.5" font-size="13" fill="#191919">North</text>
  <rect x="130" y="118" width="441" height="14" fill="#338877"/>
  <text x="576" y="129" font-size="12" fill="#191919">42%</text>
  <rect x="130" y="134" width="367.5" height="14" fill="#FFDD77"/>
  <text x="502.5" y="145" font-size="12" fill="#191919">35%</text>
  <rect x="130" y="150" width="189" height="14" fill="#2B5B9B"/>
  <text x="324" y="161" font-size="12" fill="#191919">18%</text>
  <text x="48" y="209.5" font-size="13" fill="#191919">East</text>
  <rect x="130" y="182" width="399" height="14" fill="#338877"/>
  <text x="534" y="193" font-size="12" fill="#191919">38%</text>
  <rect x="130" y="198" width="315" height="14" fill="#FFDD77"/>
  <text x="450" y="209" font-size="12" fill="#191919">30%</text>
  <rect x="130" y="214" width="220.5" height="14" fill="#2B5B9B"/>
  <text x="355.5" y="225" font-size="12" fill="#191919">21%</text>
  <text x="48" y="273.5" font-size="13" fill="#191919">Centre</text>
  <rect x="130" y="246" width="325.5" height="14" fill="#338877"/>
  <text x="460.5" y="257" font-size="12" fill="#191919">31%</text>
  <rect x="130" y="262" width="346.5" height="14" fill="#FFDD77"/>
  <text x="481.5" y="273" font-size="12" fill="#191919">33%</text>
  <rect x="130" y="278" width="126" height="14" fill="#2B5B9B"/>
  <text x="261" y="289" font-size="12" fill="#191919">12%</text>
  <text x="48" y="337.5" font-size="13" fill="#191919">West</text>
  <rect x="130" y="310" width="283.5" height="14" fill="#338877"/>
  <text x="418.5" y="321" font-size="12" fill="#191919">27%</text>
  <rect x="130" y="326" width="231" height="14" fill="#FFDD77"/>
  <text x="366" y="337" font-size="12" fill="#191919">22%</text>
  <rect x="130" y="342" width="157.5" height="14" fill="#2B5B9B"/>
  <text x="292.5" y="353" font-size="12" fill="#191919">15%</text>
  <text x="48" y="401.5" font-size="13" fill="#191919">South</text>
  <rect x="130" y="374" width="210" height="14" fill="#338877"/>
  <text x="345" y="385" font-size="12" fill="#191919">20%</text>
  <rect x="130" y="390" width="273" height="14" fill="#FFDD77"/>
  <text x="408" y="401" font-size="12" fill="#191919">26%</text>
  <rect x="130" y="406" width="94.5" height="14" fill="#2B5B9B"/>
  <text x="229.5" y="417" font-size="12" fill="#191919">9%</text>

  <!-- zero baseline -->
  <line x1="130" y1="112" x2="130" y2="426" stroke="#B8B8B8" stroke-width="1"/>

  <!-- source -->
  <text x="48" y="454" font-size="11" fill="#191919">Source: Example nutrition survey, 2025</text>
</svg>
