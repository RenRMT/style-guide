  <!-- annotate the outlier -->
  <circle cx="496" cy="188.4" r="9" fill="none" stroke="#191919" stroke-width="1.5"/>
  <line x1="505" y1="184.4" x2="522" y2="168.4" stroke="#191919" stroke-width="1"/>
  <text x="526" y="158.4" font-size="12" font-weight="600" fill="#191919" text-anchor="end">District K: high mortality</text>
  <text x="526" y="173.4" font-size="12" fill="#191919" text-anchor="end">despite many health workers</text>

  <!-- x-axis values and title -->
  <g font-size="13" fill="#191919" text-anchor="middle">
    <text x="80" y="380">0</text>
    <text x="184" y="380">10</text>
