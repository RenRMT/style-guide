<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 476" width="660" height="476" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Scatter plot</title>
  <desc id="d">A scatter plot of 41 districts: health workers per 10,000 people against child deaths per 1,000 births, coloured urban and rural. A dashed trend line slopes downward. District K, an urban district with many health workers but high mortality, is circled.</desc>
  <rect width="660" height="476" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">More health workers, fewer child deaths</text>
  <text x="48" y="64" font-size="15" fill="#191919">Health workers and child mortality by district, 2025</text>

  <!-- legend: above the plot, left-aligned -->
  <circle cx="54" cy="92" r="5" fill="#2B5B9B"/><text x="66" y="96.5" font-size="13" fill="#191919">Urban</text>
  <circle cx="134" cy="92" r="5" fill="#338877"/><text x="146" y="96.5" font-size="13" fill="#191919">Rural</text>

  <text x="48" y="124" font-size="13" fill="#191919">Child deaths per 1,000 births</text>

  <!-- gridlines and axis values -->
  <g stroke="#ECECEC" stroke-width="1">
    <line x1="80" y1="305" x2="600" y2="305"/>
    <line x1="80" y1="250" x2="600" y2="250"/>
    <line x1="80" y1="195" x2="600" y2="195"/>
    <line x1="80" y1="140" x2="600" y2="140"/>
  </g>
  <line x1="80" y1="360" x2="600" y2="360" stroke="#B8B8B8" stroke-width="1"/>
  <g font-size="13" fill="#191919" text-anchor="end">
    <text x="70" y="364">0</text>
    <text x="70" y="309">25</text>
    <text x="70" y="254">50</text>
    <text x="70" y="199">75</text>
    <text x="70" y="144">100</text>
  </g>

  <!-- trend line: least-squares fit, y = 90.3 -1.26x -->
  <line x1="100.8" y1="167" x2="579.2" y2="294.8" stroke="#191919" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="579.2" y="318.8" font-size="12" fill="#191919" text-anchor="end">Linear trend</text>

  <!-- points: dark data colours, slight transparency -->
  <g fill-opacity="0.85">
