<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" width="660" height="404" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Column chart</title>
  <desc id="d">Monthly incident counts for 2025 as twelve Teal columns starting from a zero baseline. Incidents rise from about 40 in winter to a peak of 70 in July, which is labelled.</desc>
  <rect width="660" height="404" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">Incidents peak in July</text>
  <text x="48" y="64" font-size="15" fill="#191919">Recorded security incidents per month, 2025</text>

  <!-- gridlines and axis values -->
  <g stroke="#ECECEC" stroke-width="1">
    <line x1="80" y1="275" x2="610" y2="275"/>
    <line x1="80" y1="220" x2="610" y2="220"/>
    <line x1="80" y1="165" x2="610" y2="165"/>
    <line x1="80" y1="110" x2="610" y2="110"/>
  </g>
  <line x1="80" y1="330" x2="610" y2="330" stroke="#B8B8B8" stroke-width="1"/>
  <g font-size="13" fill="#191919" text-anchor="end">
    <text x="70" y="334">0</text>
    <text x="70" y="279">20</text>
    <text x="70" y="224">40</text>
    <text x="70" y="169">60</text>
    <text x="70" y="114">80</text>
  </g>

  <!-- columns: 67% of each slot, 2.75 px per incident -->
  <g>
    <rect x="87.3" y="214.5" width="29.6" height="115.5" fill="#338877"/>
    <rect x="131.5" y="225.5" width="29.6" height="104.5" fill="#338877"/>
    <rect x="175.6" y="189.8" width="29.6" height="140.2" fill="#338877"/>
    <rect x="219.8" y="200.8" width="29.6" height="129.2" fill="#338877"/>
    <rect x="264" y="178.8" width="29.6" height="151.2" fill="#338877"/>
    <rect x="308.1" y="156.8" width="29.6" height="173.2" fill="#338877"/>
    <rect x="352.3" y="137.5" width="29.6" height="192.5" fill="#338877"/>
    <rect x="396.5" y="148.5" width="29.6" height="181.5" fill="#338877"/>
    <rect x="440.6" y="170.5" width="29.6" height="159.5" fill="#338877"/>
    <rect x="484.8" y="195.2" width="29.6" height="134.8" fill="#338877"/>
    <rect x="529" y="209" width="29.6" height="121" fill="#338877"/>
    <rect x="573.1" y="220" width="29.6" height="110" fill="#338877"/>
  </g>

  <!-- annotate the peak -->
  <text x="367.1" y="129.5" font-size="13" font-weight="600" fill="#191919" text-anchor="middle">70</text>

  <!-- month labels -->
  <g font-size="13" fill="#191919" text-anchor="middle">
    <text x="102.1" y="350">Jan</text>
    <text x="146.2" y="350">Feb</text>
    <text x="190.4" y="350">Mar</text>
    <text x="234.6" y="350">Apr</text>
    <text x="278.8" y="350">May</text>
    <text x="322.9" y="350">Jun</text>
    <text x="367.1" y="350">Jul</text>
    <text x="411.2" y="350">Aug</text>
    <text x="455.4" y="350">Sep</text>
    <text x="499.6" y="350">Oct</text>
    <text x="543.8" y="350">Nov</text>
    <text x="587.9" y="350">Dec</text>
  </g>

  <!-- source and note -->
  <text x="48" y="380" font-size="11" fill="#191919">Source: Example incident database, 2025</text>
</svg>
