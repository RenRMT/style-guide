<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 364" width="660" height="364" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">100% stacked bar chart</title>
  <desc id="d">Five regions, each a bar split into four segments that add up to 100%: piped water, well, truck and other. Region A has the most piped water at 62%, Region D the least at 22%.</desc>
  <rect width="660" height="364" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">Piped water is most common in Region A</text>
  <text x="48" y="64" font-size="15" fill="#191919">Households by main water source (%), by region, 2025</text>

  <!-- legend: above the plot, left-aligned, in segment order -->
  <rect x="48" y="86" width="12" height="12" fill="#338877"/><text x="66" y="97" font-size="13" fill="#191919">Piped</text>
  <rect x="129.5" y="86" width="12" height="12" fill="#FFDD77"/><text x="147.5" y="97" font-size="13" fill="#191919">Well</text>
  <rect x="203.5" y="86" width="12" height="12" fill="#2B5B9B"/><text x="221.5" y="97" font-size="13" fill="#191919">Truck</text>
  <rect x="285" y="86" width="12" height="12" fill="#B8B8B8"/><text x="303" y="97" font-size="13" fill="#191919">Other</text>

  <!-- bars: 100% stacked, 4.8 px per percentage point; most important segment at the baseline -->
  <text x="48" y="137.9" font-size="13" fill="#191919">Region A</text>
  <rect x="130" y="120" width="296.6" height="26.8" fill="#338877"/>
  <text x="278.8" y="137.9" font-size="12" fill="#ffffff" text-anchor="middle">62%</text>
  <rect x="427.6" y="120" width="95" height="26.8" fill="#FFDD77"/>
  <text x="475.6" y="137.9" font-size="12" fill="#191919" text-anchor="middle">20%</text>
  <rect x="523.6" y="120" width="56.6" height="26.8" fill="#2B5B9B"/>
  <text x="552.4" y="137.9" font-size="12" fill="#ffffff" text-anchor="middle">12%</text>
  <rect x="581.2" y="120" width="27.8" height="26.8" fill="#B8B8B8"/>
  <text x="595.6" y="137.9" font-size="12" fill="#191919" text-anchor="middle">6%</text>
  <text x="48" y="177.9" font-size="13" fill="#191919">Region C</text>
  <rect x="130" y="160" width="243.8" height="26.8" fill="#338877"/>
  <text x="252.4" y="177.9" font-size="12" fill="#ffffff" text-anchor="middle">51%</text>
  <rect x="374.8" y="160" width="133.4" height="26.8" fill="#FFDD77"/>
  <text x="442" y="177.9" font-size="12" fill="#191919" text-anchor="middle">28%</text>
  <rect x="509.2" y="160" width="66.2" height="26.8" fill="#2B5B9B"/>
  <text x="542.8" y="177.9" font-size="12" fill="#ffffff" text-anchor="middle">14%</text>
  <rect x="576.4" y="160" width="32.6" height="26.8" fill="#B8B8B8"/>
  <text x="593.2" y="177.9" font-size="12" fill="#191919" text-anchor="middle">7%</text>
  <text x="48" y="217.9" font-size="13" fill="#191919">Region B</text>
  <rect x="130" y="200" width="210.2" height="26.8" fill="#338877"/>
  <text x="235.6" y="217.9" font-size="12" fill="#ffffff" text-anchor="middle">44%</text>
  <rect x="341.2" y="200" width="143" height="26.8" fill="#FFDD77"/>
  <text x="413.2" y="217.9" font-size="12" fill="#191919" text-anchor="middle">30%</text>
  <rect x="485.2" y="200" width="85.4" height="26.8" fill="#2B5B9B"/>
  <text x="528.4" y="217.9" font-size="12" fill="#ffffff" text-anchor="middle">18%</text>
  <rect x="571.6" y="200" width="37.4" height="26.8" fill="#B8B8B8"/>
  <text x="590.8" y="217.9" font-size="12" fill="#191919" text-anchor="middle">8%</text>
  <text x="48" y="257.9" font-size="13" fill="#191919">Region E</text>
  <rect x="130" y="240" width="167" height="26.8" fill="#338877"/>
  <text x="214" y="257.9" font-size="12" fill="#ffffff" text-anchor="middle">35%</text>
  <rect x="298" y="240" width="157.4" height="26.8" fill="#FFDD77"/>
  <text x="377.2" y="257.9" font-size="12" fill="#191919" text-anchor="middle">33%</text>
  <rect x="456.4" y="240" width="114.2" height="26.8" fill="#2B5B9B"/>
  <text x="514" y="257.9" font-size="12" fill="#ffffff" text-anchor="middle">24%</text>
  <rect x="571.6" y="240" width="37.4" height="26.8" fill="#B8B8B8"/>
  <text x="590.8" y="257.9" font-size="12" fill="#191919" text-anchor="middle">8%</text>
  <text x="48" y="297.9" font-size="13" fill="#191919">Region D</text>
  <rect x="130" y="280" width="104.6" height="26.8" fill="#338877"/>
  <text x="182.8" y="297.9" font-size="12" fill="#ffffff" text-anchor="middle">22%</text>
  <rect x="235.6" y="280" width="181.4" height="26.8" fill="#FFDD77"/>
  <text x="326.8" y="297.9" font-size="12" fill="#191919" text-anchor="middle">38%</text>
  <rect x="418" y="280" width="147.8" height="26.8" fill="#2B5B9B"/>
  <text x="492.4" y="297.9" font-size="12" fill="#ffffff" text-anchor="middle">31%</text>
  <rect x="566.8" y="280" width="42.2" height="26.8" fill="#B8B8B8"/>
  <text x="588.4" y="297.9" font-size="12" fill="#191919" text-anchor="middle">9%</text>

  <!-- source and note -->
  <text x="48" y="340" font-size="11" fill="#191919">Source: Example household survey, 2025</text>
</svg>
