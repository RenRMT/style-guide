<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" width="660" height="404" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Line chart</title>
  <desc id="d">Three lines from 2016 to 2025, labelled at their right ends. North rises from 12 to 48 thousand, East rises slowly from 20 to 29 thousand, and South falls from 18 to 12 thousand.</desc>
  <rect width="660" height="404" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">Displacement has risen fastest in the North</text>
  <text x="48" y="64" font-size="15" fill="#191919">People displaced (thousands) by region, 2016–2025</text>

  <!-- gridlines and axis values -->
  <g stroke="#ECECEC" stroke-width="1">
    <line x1="80" y1="288" x2="560" y2="288"/>
    <line x1="80" y1="246" x2="560" y2="246"/>
    <line x1="80" y1="204" x2="560" y2="204"/>
    <line x1="80" y1="162" x2="560" y2="162"/>
    <line x1="80" y1="120" x2="560" y2="120"/>
  </g>
  <line x1="80" y1="330" x2="560" y2="330" stroke="#B8B8B8" stroke-width="1"/>
  <g font-size="13" fill="#191919" text-anchor="end">
    <text x="70" y="334">0</text>
    <text x="70" y="292">10</text>
    <text x="70" y="250">20</text>
    <text x="70" y="208">30</text>
    <text x="70" y="166">40</text>
    <text x="70" y="124">50</text>
  </g>

  <!-- lines in the dark data colours, labelled at their right ends -->
  <polyline points="80,279.6 131.1,271.2 182.2,267 233.3,250.2 284.4,229.2 335.6,212.4 386.7,191.4 437.8,174.6 488.9,153.6 540,128.4" fill="none" stroke="#338877" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="566" y="132.9" font-size="13" font-weight="600" fill="#191919">North 48</text>
  <polyline points="80,246 131.1,241.8 182.2,233.4 233.3,237.6 284.4,229.2 335.6,225 386.7,216.6 437.8,220.8 488.9,212.4 540,208.2" fill="none" stroke="#2B5B9B" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="566" y="212.7" font-size="13" fill="#191919">East 29</text>
  <polyline points="80,254.4 131.1,258.6 182.2,262.8 233.3,258.6 284.4,267 335.6,271.2 386.7,267 437.8,275.4 488.9,279.6 540,279.6" fill="none" stroke="#BC3C4C" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="566" y="284.1" font-size="13" fill="#191919">South 12</text>

  <!-- x-axis values: every third year -->
  <g font-size="13" fill="#191919" text-anchor="middle">
    <text x="80" y="350">2016</text>
    <text x="233.3" y="350">2019</text>
    <text x="386.7" y="350">2022</text>
    <text x="540" y="350">2025</text>
  </g>

  <!-- source and note -->
  <text x="48" y="380" font-size="11" fill="#191919">Source: Example displacement tracking, 2016–2025</text>
</svg>
