<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 459" width="660" height="459" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Donut chart</title>
  <desc id="d">A donut chart with four slices: Food 46%, Shelter 24%, Health 18% and Other 12%. The total of 4.2 million euros is shown in the centre.</desc>
  <rect width="660" height="459" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">Food accounts for nearly half of spending</text>
  <text x="48" y="64" font-size="15" fill="#191919">Programme spending by sector (%), 2025</text>

  <!-- slices: largest first, starting at 12 o'clock, clockwise; Other last in Steel -->
  <path d="M330,125 A125,125 0 0 1 361.1,371.1 L349.4,325.5 A78,78 0 0 0 330,172 Z" fill="#338877" stroke="#ffffff" stroke-width="2"/>
  <path d="M361.1,371.1 A125,125 0 0 1 211.1,288.6 L255.8,274.1 A78,78 0 0 0 349.4,325.5 Z" fill="#FFDD77" stroke="#ffffff" stroke-width="2"/>
  <path d="M211.1,288.6 A125,125 0 0 1 244.4,158.9 L276.6,193.1 A78,78 0 0 0 255.8,274.1 Z" fill="#2B5B9B" stroke="#ffffff" stroke-width="2"/>
  <path d="M244.4,158.9 A125,125 0 0 1 330,125 L330,172 A78,78 0 0 0 276.6,193.1 Z" fill="#B8B8B8" stroke="#ffffff" stroke-width="2"/>

  <!-- direct labels with category and percentage -->
  <text x="475.8" y="236.1" font-size="13" font-weight="600" fill="#191919" text-anchor="start">Food 46%</text>
  <text x="259.2" y="383.3" font-size="13" fill="#191919" text-anchor="end">Shelter 24%</text>
  <text x="187.6" y="217.9" font-size="13" fill="#191919" text-anchor="end">Health 18%</text>
  <text x="275.9" y="117.8" font-size="13" fill="#191919" text-anchor="end">Other 12%</text>

  <!-- total in the centre -->
  <text x="330" y="254" font-size="26" font-weight="700" fill="#191919" text-anchor="middle">€4.2m</text>
  <text x="330" y="276" font-size="13" fill="#191919" text-anchor="middle">total</text>

  <!-- source and note -->
  <text x="48" y="435" font-size="11" fill="#191919">Source: Example programme budget, 2025</text>
</svg>
