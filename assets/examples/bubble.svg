<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 512" width="660" height="512" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Bubble chart</title>
  <desc id="d">Bubble chart of twelve provinces: health workers per 10,000 people against child deaths per 1,000 births, with bubble area showing population. Larger provinces tend to have more health workers and lower mortality. Province L, small and with the fewest health workers, is labelled.</desc>
  <rect width="660" height="512" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">Larger provinces have more health workers</text>
  <text x="48" y="64" font-size="15" fill="#191919">Health workers, child mortality and population by province, 2025</text>

  <!-- size key: area scaled, round values -->
  <circle cx="63.0" cy="135.0" r="15.0" fill="none" stroke="#191919" stroke-width="0.75"/>
  <text x="84.0" y="139.0" font-size="12" fill="#191919">1 million people</text>
  <circle cx="218.0" cy="120.0" r="30.0" fill="none" stroke="#191919" stroke-width="0.75"/>
  <text x="254.0" y="124.0" font-size="12" fill="#191919">4 million people</text>

  <g transform="translate(0,36)">
  <text x="48" y="134" font-size="13" fill="#191919">Child deaths per 1,000 births</text>

  <!-- gridlines and axis values -->
  <g stroke="#ECECEC" stroke-width="1">
    <line x1="80" y1="309" x2="600" y2="309"/>
    <line x1="80" y1="258" x2="600" y2="258"/>
    <line x1="80" y1="207" x2="600" y2="207"/>
    <line x1="80" y1="156" x2="600" y2="156"/>
  </g>
  <line x1="80" y1="360" x2="600" y2="360" stroke="#B8B8B8" stroke-width="1"/>
  <g font-size="13" fill="#191919" text-anchor="end">
    <text x="70" y="364">0</text>
    <text x="70" y="313">25</text>
    <text x="70" y="262">50</text>
    <text x="70" y="211">75</text>
    <text x="70" y="160">100</text>
  </g>

  <!-- bubbles: largest first so small ones sit on top, white stroke instead of transparency -->
  <g fill="#338877" stroke="#ffffff" stroke-width="1">
    <circle cx="506.4" cy="302.9" r="28.5"/>
    <circle cx="454.4" cy="290.6" r="25.5"/>
    <circle cx="423.2" cy="296.8" r="23.2"/>
    <circle cx="381.6" cy="274.3" r="20.7"/>
    <circle cx="360.8" cy="282.5" r="17.7"/>
    <circle cx="329.6" cy="264.1" r="15.7"/>
    <circle cx="308.8" cy="268.2" r="14.2"/>
    <circle cx="277.6" cy="247.8" r="12.5"/>
    <circle cx="256.8" cy="256.0" r="11.6"/>
    <circle cx="236.0" cy="237.6" r="10.6"/>
    <circle cx="215.2" cy="241.7" r="9.5"/>
    <circle cx="163.2" cy="200.9" r="8.2"/>
  </g>

  <!-- annotate the outlier -->
  <line x1="171.2" y1="198.9" x2="191.2" y2="188.9" stroke="#191919" stroke-width="1"/>
  <text x="195.2" y="182.9" font-size="12" font-weight="600" fill="#191919">Province L: fewest health</text>
  <text x="195.2" y="197.9" font-size="12" fill="#191919">workers, highest mortality</text>

  <!-- x-axis values and title -->
  <g font-size="13" fill="#191919" text-anchor="middle">
    <text x="80" y="380">0</text>
    <text x="184" y="380">10</text>
    <text x="288" y="380">20</text>
    <text x="392" y="380">30</text>
    <text x="496" y="380">40</text>
    <text x="600" y="380">50</text>
    <text x="340" y="406">Health workers per 10,000 people</text>
  </g>

  <!-- source and note -->
  <text x="48" y="434" font-size="11" fill="#191919">Source: Example health statistics, 2025</text>
  <text x="48" y="452" font-size="11" fill="#191919">Note: Bubble area shows population.</text>
  </g>
</svg>
