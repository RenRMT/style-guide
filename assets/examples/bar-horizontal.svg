<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392" width="660" height="392" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Horizontal bar chart</title>
  <desc id="d">Eight regions sorted from most to fewest incidents. Region D is highlighted in Teal; the others are Steel. Every bar is labelled directly, so there is no value axis.</desc>
  <rect width="660" height="392" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">Region D reports the most incidents</text>
  <text x="48" y="64" font-size="15" fill="#191919">Recorded security incidents by region, 2025</text>

  <!-- bars: sorted high to low, 3.0 px per incident; one Teal highlight, the rest Steel -->
  <text x="48" y="107.2" font-size="13" font-weight="600" fill="#191919">Region D</text>
  <rect x="130" y="92" width="426" height="21.4" fill="#338877"/>
  <text x="562" y="107.2" font-size="13" font-weight="600" fill="#191919">142</text>
