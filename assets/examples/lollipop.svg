<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" width="660" height="390" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Dumbbell chart</title>
  <desc id="d">Five districts, each with a Steel dot for 2024 and a Teal dot for 2025 joined by a thin line. Access improved everywhere; West improved most, from 65% to 83%. The axis runs from 60% to 100%.</desc>
  <rect width="660" height="390" fill="#ffffff"/>

  <!-- text block -->
  <text x="48" y="40" font-size="22" font-weight="700" fill="#191919">Access to clean water improved in every district</text>
  <text x="48" y="64" font-size="15" fill="#191919">Households with access to clean water (%), 2024 and 2025</text>

  <!-- direct labels for the two series, above the first row -->
  <text x="271" y="114" font-size="13" fill="#191919" text-anchor="middle">2024</text>
  <text x="459" y="114" font-size="13" font-weight="600" fill="#191919" text-anchor="middle">2025</text>

  <!-- rows: Steel stem, Steel dot for 2024, Teal dot for 2025; sorted by 2025 value -->
  <text x="48" y="136.5" font-size="13" fill="#191919">North</text>
  <line x1="271" y1="132" x2="459" y2="132" stroke="#B8B8B8" stroke-width="2"/>
  <circle cx="271" cy="132" r="6" fill="#B8B8B8"/>
  <circle cx="459" cy="132" r="6" fill="#338877"/>
  <text x="471" y="136.5" font-size="13" font-weight="600" fill="#191919">88%</text>
  <text x="48" y="176.5" font-size="13" fill="#191919">East</text>
  <line x1="341.5" y1="172" x2="435.5" y2="172" stroke="#B8B8B8" stroke-width="2"/>
  <circle cx="341.5" cy="172" r="6" fill="#B8B8B8"/>
  <circle cx="435.5" cy="172" r="6" fill="#338877"/>
  <text x="447.5" y="176.5" font-size="13" font-weight="600" fill="#191919">86%</text>
  <text x="48" y="216.5" font-size="13" fill="#191919">Centre</text>
  <line x1="376.8" y1="212" x2="423.8" y2="212" stroke="#B8B8B8" stroke-width="2"/>
  <circle cx="376.8" cy="212" r="6" fill="#B8B8B8"/>
  <circle cx="423.8" cy="212" r="6" fill="#338877"/>
  <text x="435.8" y="216.5" font-size="13" font-weight="600" fill="#191919">85%</text>
  <text x="48" y="256.5" font-size="13" fill="#191919">West</text>
  <line x1="188.8" y1="252" x2="400.2" y2="252" stroke="#B8B8B8" stroke-width="2"/>
  <circle cx="188.8" cy="252" r="6" fill="#B8B8B8"/>
  <circle cx="400.2" cy="252" r="6" fill="#338877"/>
  <text x="412.2" y="256.5" font-size="13" font-weight="600" fill="#191919">83%</text>
  <text x="48" y="296.5" font-size="13" fill="#191919">South</text>
  <line x1="235.8" y1="292" x2="294.5" y2="292" stroke="#B8B8B8" stroke-width="2"/>
  <circle cx="235.8" cy="292" r="6" fill="#B8B8B8"/>
  <circle cx="294.5" cy="292" r="6" fill="#338877"/>
  <text x="306.5" y="296.5" font-size="13" font-weight="600" fill="#191919">74%</text>

  <!-- value axis: starts at 60%, which is allowed because dots encode position -->
  <g font-size="13" fill="#191919" text-anchor="middle">
    <text x="130" y="326">60%</text>
    <text x="247.5" y="326">70%</text>
    <text x="365" y="326">80%</text>
    <text x="482.5" y="326">90%</text>
    <text x="600" y="326">100%</text>
  </g>

  <!-- source and note -->
  <text x="48" y="348" font-size="11" fill="#191919">Source: Example household survey, 2024–2025</text>
  <text x="48" y="366" font-size="11" fill="#191919">Note: The axis starts at 60%.</text>
</svg>
