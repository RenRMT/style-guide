  <title id="t">Small multiples</title>
  <desc id="d">Six small line charts, one per region, sorted by their 2025 value and sharing the same axes. Each panel shows its region in Teal against the other regions in light grey. North rises most steeply, to 48 thousand; Coast also rises sharply; West and South decline.</desc>
