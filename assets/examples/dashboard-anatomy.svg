<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" width="660" height="480" font-family="IBM Plex Sans, Calibri, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a dashboard</title>
  <desc id="d">A one-screen operations dashboard with numbered markers for each layout element: title, scope and last-updated time, filters, KPI row, status signal, trend chart, breakdown chart, partial-period marking, and source with definitions.</desc>
  <rect width="660" height="480" fill="#F3F3F3"/>

  <!-- header, on the canvas, above a hairline -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#191919">Field operations overview</text>
  <text x="40" y="62" font-size="13" fill="#191919">Weekly data, last 12 weeks · Last updated 28 Oct 2026, 06:00</text>
  <g font-size="12" fill="#191919">
    <rect x="40.5" y="74.5" width="118" height="22" rx="3" fill="#FFFFFF" stroke="#5C6B68"/><text x="50" y="90">Region: All ▾</text>
    <rect x="168.5" y="74.5" width="160" height="22" rx="3" fill="#FFFFFF" stroke="#5C6B68"/><text x="178" y="90">Period: Last 12 weeks ▾</text>
  </g>
  <line x1="0" y1="106.5" x2="660" y2="106.5" stroke="#D6E7E4"/>

  <!-- KPI row: white tiles, hairline, 4px top rule (teal, or the status colour) -->
  <rect x="40.5" y="114.5" width="182" height="92" rx="3" fill="#FFFFFF" stroke="#D6E7E4"/><rect x="40.5" y="114.5" width="182" height="4" fill="#1C6758"/>
  <rect x="238.5" y="114.5" width="182" height="92" rx="3" fill="#FFFFFF" stroke="#D6E7E4"/><rect x="238.5" y="114.5" width="182" height="4" fill="#BC3C4C"/>
  <rect x="436.5" y="114.5" width="182" height="92" rx="3" fill="#FFFFFF" stroke="#D6E7E4"/><rect x="436.5" y="114.5" width="182" height="4" fill="#2B5B9B"/>
  <g font-size="12" fill="#5C6B68">
    <text x="52" y="136">Missions completed</text>
    <text x="250" y="136">Missions denied or delayed</text>
    <text x="448" y="136">Sites reached</text>
  </g>
  <g font-size="30" font-weight="700" fill="#191919">
    <text x="52" y="172">412</text><text x="250" y="172">27%</text><text x="448" y="172">88<tspan font-size="16" font-weight="400" fill="#5C6B68"> of 95</tspan></text>
  </g>
  <polyline points="140,174.4 151,169.6 162,172.0 173,166.0 184,163.6 195,158.8 206,161.2 217,155.2" fill="none" stroke="#338877" stroke-width="2"/>
  <circle cx="217" cy="155.2" r="3" fill="#338877"/>
  <g font-size="12" fill="#191919">
    <text x="52" y="195">+6% on previous 4 weeks</text>
    <rect x="250" y="184" width="14" height="14" fill="#BC3C4C"/><text x="257" y="195" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text>
    <text x="270" y="195">Off track · target 20%</text>
    <rect x="448" y="184" width="14" height="14" fill="#2B5B9B"/><text x="455" y="195" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="468" y="195">On track · target 85</text>
  </g>

  <!-- trend tile -->
  <rect x="40.5" y="220.5" width="320" height="190" rx="3" fill="#FFFFFF" stroke="#D6E7E4"/>
  <text x="52" y="240" font-size="14" font-weight="700" fill="#191919">Missions per week</text>
  <text x="52" y="257" font-size="12" fill="#5C6B68">Number of missions, by outcome</text>
  <g stroke="#ECECEC"><line x1="72" y1="292" x2="348" y2="292"/><line x1="72" y1="337" x2="348" y2="337"/></g>
  <line x1="72" y1="382" x2="348" y2="382" stroke="#B8B8B8"/>
  <g font-size="11" fill="#5C6B68" text-anchor="end"><text x="66" y="296">100</text><text x="66" y="341">50</text><text x="66" y="386">0</text></g>
  <g font-size="11" fill="#5C6B68" text-anchor="middle"><text x="72.0" y="400">Aug</text><text x="167.9" y="400">Sep</text><text x="258.8" y="400">Oct</text></g>
  <polyline points="72.0,295.6 94.7,291.1 117.5,293.8 140.2,288.4 162.9,292.9 185.6,286.6 208.4,289.3 231.1,284.8 253.8,287.5 276.5,283.0 299.3,285.7" fill="none" stroke="#338877" stroke-width="2"/>
  <polyline points="299.3,285.7 322.0,326.2" fill="none" stroke="#338877" stroke-width="2" stroke-dasharray="4 3"/>
  <polyline points="72.0,345.1 94.7,347.8 117.5,346.0 140.2,349.6 162.9,346.9 185.6,350.5 208.4,348.7 231.1,352.3 253.8,351.4 276.5,354.1 299.3,355.0" fill="none" stroke="#FF9779" stroke-width="2"/>
  <polyline points="299.3,355.0 322.0,365.8" fill="none" stroke="#FF9779" stroke-width="2" stroke-dasharray="4 3"/>
  <g font-size="11" fill="#191919">
    <text x="242.5" y="273.0">Completed</text>
    <text x="72.0" y="335.1">Denied or delayed</text>
    <text x="316.0" y="344.2" text-anchor="middle">partial</text>
  </g>

  <!-- breakdown tile -->
  <rect x="376.5" y="220.5" width="242" height="190" rx="3" fill="#FFFFFF" stroke="#D6E7E4"/>
  <text x="388" y="240" font-size="14" font-weight="700" fill="#191919">Denied or delayed, by region</text>
  <text x="388" y="257" font-size="12" fill="#5C6B68">Share of planned missions, last 4 weeks</text>
  <text x="388" y="293" font-size="12" fill="#191919">North</text>
  <rect x="436" y="280" width="137" height="18" fill="#FF9779"/><text x="579" y="293" font-size="12" font-weight="600" fill="#191919">38%</text>
  <text x="388" y="319" font-size="12" fill="#191919">East</text>
  <rect x="436" y="306" width="112" height="18" fill="#FF9779"/><text x="554" y="319" font-size="12" font-weight="600" fill="#191919">31%</text>
  <text x="388" y="345" font-size="12" fill="#191919">South</text>
  <rect x="436" y="332" width="86" height="18" fill="#FF9779"/><text x="528" y="345" font-size="12" font-weight="600" fill="#191919">24%</text>
  <text x="388" y="371" font-size="12" fill="#191919">West</text>
  <rect x="436" y="358" width="50" height="18" fill="#FF9779"/><text x="492" y="371" font-size="12" font-weight="600" fill="#191919">14%</text>
  <line x1="436" y1="276" x2="436" y2="380" stroke="#B8B8B8"/>

  <!-- footer -->
  <text x="40" y="436" font-size="11" fill="#5C6B68">Source: Example operations log, updated daily</text>
  <text x="40" y="456" font-size="11" fill="#5C6B68">Definitions: see metric glossary. The current week is partial and shown dashed.</text>
  <rect x="556" y="428" width="62" height="34" rx="3" fill="#1C6758"/>
  <text x="587" y="450" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LOGO</text>

  <!-- numbered markers -->
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#191919">
    <circle cx="20" cy="33" r="10" fill="#FF9779"/><text x="20" y="37">1</text>
    <circle cx="20" cy="58" r="10" fill="#FF9779"/><text x="20" y="62">2</text>
    <circle cx="20" cy="86" r="10" fill="#FF9779"/><text x="20" y="90">3</text>
    <circle cx="20" cy="160" r="10" fill="#FF9779"/><text x="20" y="164">4</text>
    <circle cx="638" cy="191" r="10" fill="#FF9779"/><text x="638" y="195">5</text>
    <circle cx="20" cy="246" r="10" fill="#FF9779"/><text x="20" y="250">6</text>
    <circle cx="638" cy="246" r="10" fill="#FF9779"/><text x="638" y="250">7</text>
    <circle cx="350.0" cy="340.2" r="10" fill="#FF9779"/><text x="350.0" y="344.2">8</text>
    <circle cx="20" cy="446" r="10" fill="#FF9779"/><text x="20" y="450">9</text>
  </g>
</svg>
